name: Сообщить об ошибке
description: Расскажите о проблеме в редакторе, предпросмотре или готовом квизе
title: "[Ошибка]: "
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что помогаете улучшать Tiqui Quiz. Не публикуйте персональные данные ребёнка или другие конфиденциальные сведения.

  - type: textarea
    id: problem
    attributes:
      label: Что произошло?
      description: Опишите наблюдаемое поведение и сообщение об ошибке.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Что вы ожидали?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести проблему?
      description: Перечислите действия по порядку.
      placeholder: |
        1. Открыть приложение
        2. Вставить Markdown
        3. Удалить или изменить строку…
    validations:
      required: true

  - type: textarea
    id: markdown
    attributes:
      label: Минимальный пример Markdown
      description: Оставьте только строки, необходимые для воспроизведения проблемы, и удалите персональные данные.
      render: markdown

  - type: input
    id: environment
    attributes:
      label: Браузер и операционная система
      placeholder: Например, Chrome 140, Windows 11

  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка перед публикацией
      options:
        - label: Я убедился, что обращение не содержит персональных или конфиденциальных данных.
          required: true
